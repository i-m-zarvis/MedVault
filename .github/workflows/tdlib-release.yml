name: Build and publish pinned TDLib

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medvault-tdlib-c8828d50
  cancel-in-progress: false

jobs:
  build-tdlib:
    runs-on: ubuntu-latest
    env:
      TD_LIB_COMMIT: c8828d50f5eac2fc7089ce1089d7ce9095c61b5e
      TD_LIB_RELEASE_TAG: tdlib-c8828d50f5eac2fc7089ce1089d7ce9095c61b5e

    steps:
      - name: Checkout MedVault
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pinned official TDLib Android package
        run: |
          git clone https://github.com/tdlib/td.git tdlib-source
          git -C tdlib-source checkout "$TD_LIB_COMMIT"
          docker buildx build \
            --file tdlib-source/example/android/Dockerfile \
            --build-arg COMMIT_HASH="$TD_LIB_COMMIT" \
            --cache-from type=gha,scope=tdlib-android-"$TD_LIB_COMMIT" \
            --cache-to type=gha,scope=tdlib-android-"$TD_LIB_COMMIT",mode=max \
            --output type=local,dest=tdlib-output \
            tdlib-source/example/android

      - name: Verify and checksum package
        run: |
          test -s tdlib-output/tdlib.zip
          mkdir -p verify
          unzip -q tdlib-output/tdlib.zip -d verify
          test -s verify/tdlib/java/org/drinkless/tdlib/Client.java
          test -s verify/tdlib/libs/arm64-v8a/libtdjni.so
          test -s verify/tdlib/libs/armeabi-v7a/libtdjni.so
          test -s verify/tdlib/libs/x86/libtdjni.so
          test -s verify/tdlib/libs/x86_64/libtdjni.so
          cp tdlib-output/tdlib.zip .
          sha256sum tdlib.zip > tdlib.zip.sha256
          cat tdlib.zip.sha256

      - name: Publish immutable versioned TDLib release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TD_LIB_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TD_LIB_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "TDLib Android $TD_LIB_COMMIT" \
              --notes "Pinned official TDLib Android Java bindings and native libraries. Source commit: $TD_LIB_COMMIT."
          fi
          gh release upload "$TD_LIB_RELEASE_TAG" tdlib.zip tdlib.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload build artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: TDLib-Android-c8828d50
          path: |
            tdlib.zip
            tdlib.zip.sha256
          if-no-files-found: error
          retention-days: 30

name: Build MedVault APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "New-branch-medvalut", "Telegram-integration"]

concurrency:
  group: medvault-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download pinned TDLib package
        if: github.ref == 'refs/heads/Telegram-integration'
        run: |
          TD_LIB_RELEASE_TAG=tdlib-c8828d50f5eac2fc7089ce1089d7ce9095c61b5e
          TD_LIB_BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TD_LIB_RELEASE_TAG"
          curl --fail --location --retry 3 "$TD_LIB_BASE_URL/tdlib.zip" --output tdlib.zip
          curl --fail --location --retry 3 "$TD_LIB_BASE_URL/tdlib.zip.sha256" --output tdlib.zip.sha256
          sha256sum --check tdlib.zip.sha256
          mkdir -p app/build/tdlib
          unzip -q tdlib.zip -d app/build/tdlib
          test -s app/build/tdlib/tdlib/java/org/drinkless/tdlib/Client.java
          test -s app/build/tdlib/tdlib/libs/arm64-v8a/libtdjni.so
          test -s app/build/tdlib/tdlib/libs/armeabi-v7a/libtdjni.so
          test -s app/build/tdlib/tdlib/libs/x86/libtdjni.so
          test -s app/build/tdlib/tdlib/libs/x86_64/libtdjni.so

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/medvault-signing.p12
          test -s app/medvault-signing.p12

      - name: Verify signing keystore
        run: |
          keytool -list -keystore app/medvault-signing.p12 \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Build signed release APK
        run: gradle assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MedVault-Android
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
